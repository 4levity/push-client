# push-client config example. One key=value per line; # comments and blank
# lines allowed. The file holds the raw client token: keep it 0600.
#
# Check it with:
#   push-client validate --config /path/to/this-file

# The push service endpoint (http/https, no trailing slash)
url=https://push.example.com

# This client's name (letters, numbers, dashes; must match the service's
# client list)
name=sensor-1

# The raw client token (only its sha256 is in the service config)
token=...

# Push period (default 5m; minimum 1s - the service rate-limits to 60
# requests/minute per IP)
interval=5m

# Base status file (optional): a JSON object. A missing or broken base is
# logged and an empty base is sent; the heartbeat goes out either way.
status=/etc/push-client/status.json

# Extra status files (optional, repeatable; merged over the base in this
# order, later files win, shallow merge). Each file holds a JSON object
# written by whoever produces it. A missing, unreadable or broken file
# never stops the heartbeat: its last good copy from cache= is merged
# instead (when one exists) and the miss is logged to the journal.
status_file=/opt/backup/status.json
status_file=/opt/other/status.json

# Directory for the last good copies of the status_file entries (optional;
# created 0700 when missing, the copies are 0600)
cache=/var/lib/push-client
